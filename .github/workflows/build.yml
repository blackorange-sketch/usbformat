name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: usbformat-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Formats sparse images for every scheme/file system combination...
      - name: Generate test images
        run: gradle :app:testDebugUnitTest --no-daemon

      # ...and checks them with the real tools.
      - name: Install checkers
        run: bash tools/install-checkers.sh

      - name: Verify images
        run: bash tools/verify-images.sh
